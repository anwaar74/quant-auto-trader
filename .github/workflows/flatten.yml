name: flatten-book (manual)

# One-off maintenance, never scheduled. Runs with the repo's existing secrets so
# you don't need the Alpaca keys on your laptop. Requires typing FLATTEN to arm.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type FLATTEN to close every position and reset positions.json'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install alpaca-py requests

      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "FLATTEN" ]; then
            echo "::error::confirm input was '${{ inputs.confirm }}' — expected FLATTEN. Nothing done."
            exit 1
          fi

      - name: Show what will be closed (dry run)
        run: python auto_trader/flatten.py

      - name: Flatten
        run: python auto_trader/flatten.py --yes

      - name: Commit reset ledger
        run: |
          git config user.name "auto-trader-bot"
          git config user.email "bot@users.noreply.github.com"
          git add auto_trader/positions.json
          if git diff --cached --quiet; then
            echo "positions.json already []"
          else
            git commit -m "flatten: reset lot ledger"
            git push || (git pull --rebase --autostash origin main && git push)
          fi
