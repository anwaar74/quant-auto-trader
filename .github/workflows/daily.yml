name: daily-paper-trade

on:
  schedule:
    - cron: "0 9 * * 1-5"     # 09:00 UTC = 17:00 MYT, weekdays
  workflow_dispatch: {}        # manual "Run workflow" button for testing

permissions:
  contents: write

concurrency:
  group: daily-trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily cycle
        run: python auto_trader/daily_run.py

      - name: Commit state back to repo
        if: always()
        run: |
          git config user.name "auto-trader-bot"
          git config user.email "bot@users.noreply.github.com"
          # Add only paths that exist, ONE AT A TIME. `git add a b c` validates
          # every pathspec first and aborts staging ENTIRELY if any one is
          # missing — so a stale `paper_log.csv` in this list silently froze
          # positions.json at [] on every run, and the book bought daily and
          # never sold. Never batch pathspecs that may not exist.
          for f in auto_trader/positions.json auto_trader/trades_log.csv \
                   auto_trader/equity_log.csv day10_run_meta.json signals_*.csv; do
            [ -e "$f" ] && git add "$f" || true
          done
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "state: $(date -u +%F)"
            git push || (git pull --rebase --autostash origin main && git push)
            echo "--- state persisted ---"
            git --no-pager show --stat --oneline HEAD
          fi
          echo "--- positions.json now in repo ---"
          cat auto_trader/positions.json || echo "(none)"

      - name: Upload executed notebook (debug aid)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: day10_last_run
          path: auto_trader/day10_last_run.ipynb
          if-no-files-found: ignore
